[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-design"
version = "0.47.1"
description = "Local reusable design component catalog and engineering evidence"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=1.20,<2", "platformdirs>=4,<5", "psutil>=6,<8", "quickjs==1.19.4"]

[project.optional-dependencies]
search = ["onnxruntime>=1.23,<2", "tokenizers>=0.22,<1", "numpy>=2,<3"]
desktop = ["pywebview>=6,<7", "pyinstaller>=6,<7", "QtPy>=2.4,<3; sys_platform == 'linux'", "PyQt6>=6.7,<7; sys_platform == 'linux'", "PyQt6-WebEngine>=6.7,<7; sys_platform == 'linux'"]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
ag-design = "ag_design.__main__:main"

[tool.setuptools.packages.find]
include = ["ag_design*", "desktop_support*", "service_telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
