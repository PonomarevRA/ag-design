name: Community desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'PonomarevRA/ag-design' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify community source and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python tools/verify_repository.py --git
          python tools/release_assets.py "$RELEASE_TAG"
  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            payload: dist/AG Design Community.app
            binary: dist/AG Design Community.app/Contents/MacOS/AgDesign
          - runner: macos-15-intel
            payload: dist/AG Design Community.app
            binary: dist/AG Design Community.app/Contents/MacOS/AgDesign
          - runner: windows-2022
            payload: dist/AgDesign
            binary: dist/AgDesign/AgDesign.exe
          - runner: ubuntu-24.04
            payload: dist/AgDesign
            binary: dist/AgDesign/AgDesign
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64
      - run: python -m pip install ".[desktop,test,search]"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Verify executable version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_BINARY: ${{ matrix.binary }}
        run: test "$("./$APP_BINARY" --version)" = "${RELEASE_TAG#v}"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: bash
        env:
          APP_PAYLOAD: ${{ matrix.payload }}
        run: python packaging/build_installer.py --manifest packaging/desktop-product.json --source "$APP_PAYLOAD" --output artifacts/installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.runner }}
          path: artifacts/installers
          if-no-files-found: error
  release:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Publish checked installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_assets.py "$RELEASE_TAG" --assets release-assets --publish
