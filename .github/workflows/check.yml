name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python tools/verify_repository.py --git
      - name: Scan reachable history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/ag-gitleaks.tgz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/ag-gitleaks.tgz' | sha256sum --check
          tar -xzf /tmp/ag-gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact=100 --no-banner
      - run: python -m pip install -e '.[test]'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: python -m pytest -q
      - run: python tools/verify_repository.py --git
